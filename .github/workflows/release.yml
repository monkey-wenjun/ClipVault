# 可选，将显示在 GitHub 存储库的"操作"选项卡中的工作流名称
name: Release CI

# 指定此工作流的触发器
on:
  push:
    # 匹配特定标签 (refs/tags)
    tags:
      - "v*" # 推送事件匹配 v*, 例如 v1.0，v20.15.10 等来触发工作流
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      # 安装 Node.js
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 发布 Release，使用自定义名称
      - name: Generate changelog
        id: create_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/*/}
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi
          echo "Using tag: $TAG"
          npx changelogithub --draft --name "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # 编译 Tauri
  build-app:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"

          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-latest"
            target: "i686-pc-windows-msvc"
          - platform: "windows-latest"
            target: "aarch64-pc-windows-msvc"

          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-22.04"
            target: "aarch64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      # 安装 Rust（必须先于添加 target）
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install ARM cross-compile dependencies (ubuntu only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64

          # GitHub runners point sources.list at an amd64-only mirror
          # (azure.archive.ubuntu.com), so rewriting its URL to ports.ubuntu.com
          # never matches anything (and ports does not serve amd64 at all).
          # Instead: add a dedicated arm64 ports source and restrict the existing
          # sources to amd64.
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main universe restricted multiverse" | sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list > /dev/null
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list

          sudo apt-get update

          # 安装交叉编译工具链
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

          # 安装 ARM64 依赖库。不能用 "|| true"：静默失败会让构建在很后面的
          # openssl-sys 才炸，还查不到原因。
          sudo apt-get install -y libssl-dev:arm64 libwebkit2gtk-4.1-dev:arm64 libappindicator3-dev:arm64 librsvg2-dev:arm64 patchelf

          # openssl-sys 只接受一个 include 根目录，而 Ubuntu 的 multiarch 把通用
          # 头放在 /usr/include/openssl、架构特定的 opensslconf.h 放在
          # /usr/include/aarch64-linux-gnu/openssl —— 合并成单一前缀给交叉编译用。
          sudo mkdir -p /usr/aarch64-linux-gnu/openssl-arm64/include/openssl
          sudo cp /usr/include/openssl/*.h /usr/aarch64-linux-gnu/openssl-arm64/include/openssl/
          sudo cp /usr/include/aarch64-linux-gnu/openssl/opensslconf.h /usr/aarch64-linux-gnu/openssl-arm64/include/openssl/

          # 验证 OpenSSL ARM64 库文件
          echo "=== Verifying OpenSSL ARM64 libraries ==="
          ls -la /usr/lib/aarch64-linux-gnu/libssl* /usr/lib/aarch64-linux-gnu/libcrypto* > /dev/null && echo "ARM64 OpenSSL libraries present" || { echo "ERROR: ARM64 OpenSSL libraries missing"; exit 1; }

      # 使用 Rust 缓存，加快安装速度
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/target
          key: ${{ matrix.target }}

      # 获取 pnpm 缓存
      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 安装依赖
      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      # 构建前端（添加环境变量避免内存问题）
      - name: Build frontend
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # 设置交叉编译环境变量（ARM Linux）
      - name: Setup ARM cross-compile env
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          # pkg-config 走路径直连：不要设 PKG_CONFIG_SYSROOT_DIR。Ubuntu 的
          # multiarch 头文件分散在 /usr/include 与 /usr/include/aarch64-linux-gnu，
          # 设了 sysroot 会把所有 -I 前缀化到不存在的
          # /usr/aarch64-linux-gnu/usr/include/... 下。直接用现成路径即可
          # （arm64 的 .pc 文件 libdir=/usr/lib/aarch64-linux-gnu，
          # 其中的 arch 特定头如 glibconfig.h、dbus-arch-deps.h 也都正确）。
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          # OpenSSL：include 指向上一步合并好的单一前缀，lib 指向 arm64 实际库目录
          echo "OPENSSL_INCLUDE_DIR=/usr/aarch64-linux-gnu/openssl-arm64/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV

      # 执行构建，以及推送 github release
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClipVault ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          # aarch64 交叉打包时 linuxdeploy 的 aarch64 版无法在 x86_64 主机上执行
          # (Exec format error), 所以 ARM64 只出 deb/rpm —— 两者都是纯 Rust 打包,
          # 不需要运行目标架构的程序。AppImage 仅提供 amd64。
          args: --target ${{ matrix.target }} ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '--bundles deb,rpm' || '' }}
